<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LikeSnake — Slime Challenge</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#071016; color:#d9ffff; font-family:system-ui,Segoe UI,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  #game { width:min(100vw, 1100px); padding:12px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 10px; }
  h1 { margin:0; font-size:clamp(18px,3vw,28px); letter-spacing:.08em; color:#7effd2; text-shadow:0 0 14px #26a98566; }
  .half-heart { display:inline-block; width:.5em; overflow:hidden; vertical-align:baseline; }\n  #stats { display:flex; gap:8px; flex-wrap:wrap; font:700 13px ui-monospace,monospace; }
  .stat { border:1px solid #24564e; background:#0b1e25; border-radius:8px; padding:7px 10px; }
  canvas { display:block; width:100%; aspect-ratio: 16 / 10; max-height:calc(100vh - 130px); border:1px solid #1e5550; border-radius:12px; background:#07151d; box-shadow:0 0 30px #00d5a015; touch-action:none; }
  #help { margin-top:8px; color:#8fb8bd; font-size:12px; text-align:center; }
  #audioControls { display:flex; justify-content:center; gap:8px; margin-top:8px; }
  #audioControls button { margin:0; padding:6px 12px; background:#0b2828; color:#bffff0; border-color:#2b8875; font-size:12px; }
  #overlay { position:fixed; inset:0; display:none; place-items:center; background:#02090bd9; padding:20px; text-align:center; }
  #panel { max-width:480px; padding:26px; border:1px solid #2c766a; border-radius:16px; background:#0b1b22; box-shadow:0 0 40px #00e0a522; }
  #panel h2 { color:#7effd2; margin:0 0 8px; font-size:30px; }
  button { border:1px solid #55d9ad; border-radius:8px; padding:10px 18px; color:#071610; background:#7effd2; font-weight:800; cursor:pointer; margin-top:12px; }
  #touch { display:none; gap:8px; justify-content:center; margin-top:10px; }
  #touch button { margin:0; min-width:54px; background:#0b2828; color:#bffff0; border-color:#2b8875; touch-action:manipulation; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<div id="game">
  <header>
    <h1>LIKE SNAKE <small style="font-size:.55em;color:#8fb8bd">/ SLIME CHALLENGE</small></h1>
    <div id="stats">
      <div class="stat">SCORE <span id="score">0</span></div>
      <div class="stat">LEVEL <span id="level">1</span></div>
      <div class="stat">LENGTH <span id="length">3</span></div>
      <div class="stat">LIVES <span id="lives">♥♥♥</span></div>
    </div>
  </header>
  <canvas id="board" width="960" height="600" aria-label="Game board"></canvas>
  <div id="help">WASD / Arrow keys: move · Space: pause · Collect 8 pellets and enter the door to reach the next level. Avoid walls, obstacles, and your own tail!</div>
  <div id="audioControls"><button id="musicToggle">♫ MUSIC: ON</button><button id="soundToggle">♪ SFX: ON</button></div>
  <div id="touch">
    <button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button><button id="pauseTouch">Ⅱ</button>
  </div>
</div>
<div id="overlay"><div id="panel"><h2 id="overTitle">Slime!</h2><p id="overText"></p><button id="restart">PLAY AGAIN</button></div></div>
<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const COLS = 32, ROWS = 20;
  let cell, snake, dir, queued, food, blocks, score, lives, level, eaten, tickMs, lastTick, paused, ended, particles;
  const Config = { audio: { stepSeconds: 0.145, steps: 2048, masterGain: 0.7, musicGain: 0.22, sfxGain: 0.75 } };
  const AudioSystem = {
    ctx:null, master:null, musicBus:null, sfxBus:null, musicStep:0, musicOn:true, sfxOn:true, timer:null,
    get trackSeconds() { return Config.audio.stepSeconds * Config.audio.steps; },
    init() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor || this.ctx) return;
      this.ctx = new AudioCtor();
      this.master = this.ctx.createGain();
      this.master.gain.value = Config.audio.masterGain;
      this.master.connect(this.ctx.destination);
      this.musicBus = this.ctx.createGain();
      this.musicBus.gain.value = Config.audio.musicGain;
      this.musicBus.connect(this.master);
      this.sfxBus = this.ctx.createGain();
      this.sfxBus.gain.value = Config.audio.sfxGain;
      this.sfxBus.connect(this.master);
      this.timer = setInterval(() => this.trackerTick(), Config.audio.stepSeconds * 1000);
      if (this.ctx.state === "suspended") this.ctx.resume();
    },
    tone(bus,type,f,d,v=.05,slide=0,delay=0) {
      if (!this.ctx || !bus) return;
      const t=this.ctx.currentTime+delay, o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(Math.max(25,f),t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+d);
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+d+.02);
    },
    noise(bus,d=.06,v=.05,cut=900) {
      if (!this.ctx || !bus) return;
      const b=this.ctx.createBuffer(1,Math.max(1,(this.ctx.sampleRate*d)|0),this.ctx.sampleRate), a=b.getChannelData(0);
      for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1;
      const source=this.ctx.createBufferSource(), f=this.ctx.createBiquadFilter(), g=this.ctx.createGain(), t=this.ctx.currentTime;
      source.buffer=b; f.type="highpass"; f.frequency.value=cut;
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      source.connect(f); f.connect(g); g.connect(bus); source.start(t);
    },
    note(root,semitones) { return root*Math.pow(2,semitones/12); },
    trackerTick() {
      const step=this.musicStep;
      if(!this.ctx || !this.musicOn || paused || ended) {
        this.musicStep=(step+1)%Config.audio.steps;
        return;
      }
      const beat=step%16, bar=(step/16)|0, section=(bar/16)|0, phrase=bar%4, t=Config.audio.stepSeconds;
      const roots=[0,7,9,5,0,5,7,2], root=roots[section%8];
      const energy=[.72,.86,1,.8,.68,.92,1,.9][section%8];
      const kick=[0,6,8,14].includes(beat);
      const snare=[4,12].includes(beat);
      const hat=beat%2===0 || beat===7 || beat===15;

      // Four-on-the-floor-ish kick with a punchy snare and bright closed hats.
      if(kick) {
        this.tone(this.musicBus,"sine",this.note(48,root),.13,.15*energy,-28);
        this.noise(this.musicBus,.055,.065*energy,1100);
      }
      if(snare) {
        this.noise(this.musicBus,.105,.085*energy,1700);
        this.tone(this.musicBus,"triangle",190,.085,.055*energy,-95);
      }
      if(hat) this.noise(this.musicBus,.025,.018*energy,6500);

      // Driving eighth-note bass with occasional octave lift.
      const bassline=[0,0,7,0,3,3,10,7,0,0,7,12,10,7,3,5];
      const bass=bassline[beat];
      this.tone(this.musicBus,"square",this.note(55,root+bass),t*.72,.052*energy,-4);
      if(beat===8 || (phrase===3&&beat===15))
        this.tone(this.musicBus,"square",this.note(55,root+12),t*.45,.04*energy,-10);

      // Hook melody: a singable 4-bar motif with variation on each repeat.
      const hooks=[
        [12,-1,16,-1,19,-1,16,-1,14,-1,12,-1,9,-1,7,-1],
        [12,-1,14,16,-1,14,12,-1,9,-1,12,14,-1,16,-1],
        [19,-1,16,-1,14,12,-1,9,12,-1,14,-1,16,-1,19,-1],
        [21,-1,19,16,14,-1,12,14,16,-1,14,12,9,-1,7,-1]
      ];
      const hook=hooks[(phrase+Math.floor(section/2))%4][beat];
      if(hook>=0) {
        const leadRoot=this.note(220,root);
        this.tone(this.musicBus,"square",this.note(leadRoot,hook),t*.42,.033*energy,-7);
        // Short harmony accents to give the phrase a proper chiptune lift.
        if([0,8].includes(beat))
          this.tone(this.musicBus,"triangle",this.note(leadRoot,hook-12),t*.34,.022*energy,5,.025);
      }
      // A tiny pickup at the end of each fourth bar resolves back into the loop.
      if(phrase===3 && beat>=12) {
        const fill=[7,9,11,12][beat-12];
        this.tone(this.musicBus,"square",this.note(220,root+fill),t*.22,.025*energy,8);
      }
      this.musicStep=(step+1)%Config.audio.steps;
    },
    toggleMusic() {
      this.musicOn=!this.musicOn;
      if(this.musicBus&&this.ctx) this.musicBus.gain.setTargetAtTime(this.musicOn?Config.audio.musicGain:0,this.ctx.currentTime,.03);
      $("musicToggle").textContent=`♫ MUSIC: ${this.musicOn?"ON":"OFF"}`;
    },
    toggleSfx() {
      this.sfxOn=!this.sfxOn;
      if(this.sfxBus&&this.ctx) this.sfxBus.gain.setTargetAtTime(this.sfxOn?Config.audio.sfxGain:0,this.ctx.currentTime,.03);
      $("soundToggle").textContent=`♪ SFX: ${this.sfxOn?"ON":"OFF"}`;
    },
    sfx: {
      pickup(){AudioSystem.tone(AudioSystem.sfxBus,"triangle",520,.09,.07,180);AudioSystem.tone(AudioSystem.sfxBus,"triangle",780,.12,.055,120,.075);},
      life(){[660,880,1100].forEach((f,i)=>AudioSystem.tone(AudioSystem.sfxBus,"sine",f,.14,.07,25,i*.07));},
      level(){[523,659,784].forEach((f,i)=>AudioSystem.tone(AudioSystem.sfxBus,"triangle",f,.18,.065,0,i*.1));},
      wall(){AudioSystem.tone(AudioSystem.sfxBus,"sawtooth",115,.18,.12,-65);AudioSystem.noise(AudioSystem.sfxBus,.09,.055,400);},
      gameover(){[220,196,165,110].forEach((f,i)=>AudioSystem.tone(AudioSystem.sfxBus,"sawtooth",f,.28,.07,-20,i*.15));},
      win(){[523,659,784,1047,1319].forEach((f,i)=>AudioSystem.tone(AudioSystem.sfxBus,"square",f,.2,.07,0,i*.11));}
    }
  };
  let nextLifeScore=250, lifeFoodTimer=0, lifeFood=null, fruit=null, fruitTimer=0, door=null, exitOrb=null;
  const dirs = {
    up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
  };
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(320, Math.floor(rect.width*dpr));
    canvas.height = Math.max(200, Math.floor(rect.height*dpr));
    cell = Math.min(canvas.width/COLS, canvas.height/ROWS);
    draw();
  }
  function reset() {
    snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    dir = dirs.right; queued = dir; score=0; lives=3; level=1; eaten=0;
    nextLifeScore=250; lifeFoodTimer=0; lifeFood=null; door=null; fruit=null; fruitTimer=0; exitOrb=null;
    tickMs=260; paused=true; ended=false; particles=[]; AudioSystem.musicStep=0;
    blocks=[]; makeBlocks(); spawnFood(); lastTick=performance.now();
    $('overTitle').textContent='Lost in the slime!';
    $('overText').textContent='The slime is on a pellet hunt, but the map is getting tricky. Ready to find a way through?';
    $('restart').textContent='LET’S GO!';
    $('overlay').style.display='grid'; updateStats(); draw();
  }
  function isOccupied(p, includeItems=true) {
    if(snake.some(q=>q.x===p.x&&q.y===p.y)) return true;
    for(let n=1;n<=2;n++) {
      const q={x:snake[0].x+dir.x*n,y:snake[0].y+dir.y*n};
      if(q.x===p.x&&q.y===p.y) return true;
    }
    if(blocks.some(q=>q.x===p.x&&q.y===p.y)) return true;
    if(includeItems && [food,lifeFood,fruit,door,exitOrb].some(q=>q&&q.x===p.x&&q.y===p.y)) return true;
    return false;
  }
  function safeSpawn() {
    const candidates=[];
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) {
      const p={x,y};
      if(!isOccupied(p)) candidates.push(p);
    }
    return candidates.length?candidates[Math.floor(Math.random()*candidates.length)]:null;
  }
  function makeBlocks() {
    blocks=[];
    const count=Math.min(4+level*2,28);
    let attempts=0;
    while(blocks.length<count&&attempts++<1200) {
      const b={x:2+Math.floor(Math.random()*(COLS-4)),y:2+Math.floor(Math.random()*(ROWS-4))};
      if(isOccupied(b,false)||(Math.abs(b.x-8)<5&&Math.abs(b.y-10)<4)) continue;
      if(blocks.some(q=>q.x===b.x&&q.y===b.y)) continue;
      blocks.push(b);
    }
  }
  function spawnFood() { food=safeSpawn(); }
  function spawnLifeFood() {
    const p=safeSpawn();
    if(p){lifeFood=p;lifeFoodTimer=6500;}
  }
  function setDirection(name) {
    const next=dirs[name];
    if(!next || ended) return;
    if(next.x===-dir.x && next.y===-dir.y) return;
    queued=next;
  }
  function step() {
    if(paused||ended) return;
    dir=queued;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    const getsFood=food&&head.x===food.x&&head.y===food.y;
    const getsFruit=fruit&&head.x===fruit.x&&head.y===fruit.y;
    const getsDoor=door&&head.x===door.x&&head.y===door.y;
    const getsExit=exitOrb&&head.x===exitOrb.x&&head.y===exitOrb.y;
    const body=(getsFood||getsFruit||getsDoor||getsExit)?snake:snake.slice(0,-1);
    const wall=head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||blocks.some(b=>b.x===head.x&&b.y===head.y);
    if(wall||body.some(q=>q.x===head.x&&q.y===head.y)) {
      AudioSystem.sfx.wall();
      lives-=wall?1:0.5;
      $('overTitle').textContent=wall?'Bum! Slime narazil do zdi!':'Au! Slime se zamotal do sebe!';
      updateStats();
      if(lives<=0) finish(false);
      else { snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}]; dir=queued=dirs.right; }
      return;
    }
    snake.unshift(head);
    if(getsFood) {
      score+=10*level; eaten++; AudioSystem.sfx.pickup(); burst(food.x,food.y);
      if(eaten>=8) {
        food=null;
        if(level>=30) exitOrb=safeSpawn();
        else door=safeSpawn();
        AudioSystem.sfx.level();
      } else spawnFood();
    } else if(getsDoor) {
      door=null; level++; eaten=0;
      tickMs=Math.max(145,260-(level-1)*4);
      makeBlocks(); spawnFood(); AudioSystem.sfx.level();
    } else if(getsExit) {
      exitOrb=null; finish(true); return;
    } else if(getsFruit) {
      lives=Math.min(5,lives+0.5); fruit=null; score+=15; AudioSystem.sfx.life();
    } else snake.pop();

    if(fruit&&--fruitTimer<=0) fruit=null;
    if(getsFood&&!fruit&&Math.random()<0.16) {
      const p=safeSpawn(); if(p){fruit=p;fruitTimer=500;}
    }
    if(!lifeFood) {
      const lifeChance = lives <= 3 ? 0.0018 : lives <= 4 ? 0.00018 : 0;
      if(Math.random() < lifeChance) spawnLifeFood();
    }
    if(lifeFood) {
      lifeFoodTimer--;
      if(head.x===lifeFood.x&&head.y===lifeFood.y) {
        lives=Math.min(5,lives+1); lifeFood=null; score+=25; AudioSystem.sfx.life();
      } else if(lifeFoodTimer<=0) lifeFood=null;
    }
    while(score>=nextLifeScore) {
      lives=Math.min(5,lives+1); nextLifeScore+=250; AudioSystem.sfx.life();
    }
    updateStats();
  }

  function updateStats() {
    $('score').textContent=score;
    $('level').textContent=level;
    $('length').textContent=snake.length;
    const whole=Math.floor(lives), half=(lives-whole)>=0.5;
    $('lives').textContent='♥'.repeat(whole)+(half?'½':'')+'♡'.repeat(Math.max(0,5-whole-(half?1:0)));
  }
  function finish(win) {
    ended=true;
    if(win) AudioSystem.sfx.win(); else AudioSystem.sfx.gameover();
    if(win) $('overTitle').textContent='SLIME MASTER!';
    $('overText').textContent=win
      ? `Victory! Našel jsi východ po všech 30 levelech! Score: ${score} · Délka: ${snake.length}`
      : `Slime už toho má dost. Score: ${score} · Level: ${level} · Délka: ${snake.length}`;
    $('restart').textContent=win?'JEŠTĚ JEDNU VÝPRAVU!':'ZKUSIT ZNOVU';
    $('overlay').style.display='grid';
  }
  function burst(x,y) {
    for(let i=0;i<12;i++) particles.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,life:20});
  }
  function draw() {
    if(!ctx||!cell) return;
    const w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#07151d';ctx.fillRect(0,0,w,h);
    // subtle grid
    ctx.strokeStyle='#12303a';ctx.lineWidth=1;
    for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,ROWS*cell);ctx.stroke();}
    for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(COLS*cell,y*cell);ctx.stroke();}
    // Obstacles
    blocks.forEach(b=>{
      const x=b.x*cell,y=b.y*cell;
      ctx.fillStyle='#703e61';ctx.fillRect(x+2,y+2,cell-4,cell-4);
      ctx.strokeStyle='#d879b8';ctx.strokeRect(x+3,y+3,cell-6,cell-6);
      ctx.fillStyle='#b45c9b';ctx.fillRect(x+cell*.25,y+cell*.25,cell*.5,cell*.5);
    });
    // food orb
    if(food) {
      const x=(food.x+.5)*cell,y=(food.y+.5)*cell;
      const r=cell*.34;
      const grad=ctx.createRadialGradient(x-r*.3,y-r*.35,1,x,y,r*1.7);
      grad.addColorStop(0,'#fff9c7');grad.addColorStop(.35,'#ffdc62');grad.addColorStop(1,'#ff7b36');
      ctx.shadowColor='#ffbd4a';ctx.shadowBlur=cell*.5;
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
    if(door) {
      const x=(door.x+.5)*cell,y=(door.y+.5)*cell;
      ctx.shadowColor='#b18cff';ctx.shadowBlur=cell*.65;ctx.fillStyle='#9b78ff';
      ctx.fillRect(x-cell*.32,y-cell*.42,cell*.64,cell*.84);ctx.shadowBlur=0;
      ctx.fillStyle='#d9c8ff';ctx.fillRect(x-cell*.22,y-cell*.32,cell*.44,cell*.64);
      ctx.fillStyle='#51318f';ctx.beginPath();ctx.arc(x+cell*.12,y,cell*.035,0,Math.PI*2);ctx.fill();
    }
    if(exitOrb) {
      const x=(exitOrb.x+.5)*cell,y=(exitOrb.y+.5)*cell,r=cell*.4;
      ctx.shadowColor='#8dfcff';ctx.shadowBlur=cell*.7;ctx.fillStyle='#8dfcff';
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#06212b';ctx.font=`bold ${cell*.65}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('EXIT',x,y);
    }
    if(fruit) {
      const x=(fruit.x+.5)*cell,y=(fruit.y+.5)*cell,r=cell*.34;
      ctx.fillStyle='#ff647c';ctx.shadowColor='#ff647c';ctx.shadowBlur=cell*.45;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle='#b7ff9d';ctx.lineWidth=Math.max(2,cell*.08);ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+cell*.13,y-r-cell*.18);ctx.stroke();
    }
    // bonus heart orb
    if(lifeFood) {
      const x=(lifeFood.x+.5)*cell,y=(lifeFood.y+.5)*cell,r=cell*.36;
      ctx.shadowColor='#ff6b9a';ctx.shadowBlur=cell*.5;ctx.fillStyle='#ff8caf';
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#fff0f5';ctx.font=`bold ${cell*.7}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♥',x,y);
    }
    // slime body
    snake.forEach((s,i)=>{
      const x=s.x*cell,y=s.y*cell, pad=cell*.08;
      const g=ctx.createLinearGradient(x,y,x+cell,y+cell);
      g.addColorStop(0,i===0?'#aaffd8':'#43d6a0');g.addColorStop(1,i===0?'#36bfa4':'#167e75');
      ctx.fillStyle=g;ctx.shadowColor='#43ffc2';ctx.shadowBlur=i===0?cell*.35:cell*.12;
      rounded(x+pad,y+pad,cell-pad*2,cell-pad*2,cell*.28);ctx.fill();
      ctx.shadowBlur=0;
      if(i===0) {
        // eyes look in movement direction
        const cx=x+cell/2,cy=y+cell/2;
        const ex=-dir.y*cell*.16,ey=dir.x*cell*.16;
        ctx.fillStyle='#eafff7';
        ctx.beginPath();ctx.arc(cx-cell*.13+ex,cy-cell*.12+ey,cell*.105,0,Math.PI*2);ctx.arc(cx+cell*.13+ex,cy-cell*.12+ey,cell*.105,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#08221b';
        ctx.beginPath();ctx.arc(cx-cell*.13+ex+dir.x*cell*.035,cy-cell*.12+ey+dir.y*cell*.035,cell*.05,0,Math.PI*2);ctx.arc(cx+cell*.13+ex+dir.x*cell*.035,cy-cell*.12+ey+dir.y*cell*.035,cell*.05,0,Math.PI*2);ctx.fill();
      }
    });
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      ctx.fillStyle=`rgba(255,220,98,${p.life/20})`;
      ctx.beginPath();ctx.arc((p.x)*cell,(p.y)*cell,cell*.06,0,Math.PI*2);ctx.fill();
      p.x+=p.vx;p.y+=p.vy;p.life--;
    });
    if(paused&&!ended) {
      ctx.fillStyle='#02090aaa';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#cffff0';ctx.font=`bold ${cell*1.5}px system-ui`;ctx.textAlign='center';ctx.fillText('PAUZA',w/2,h/2);
    }
  }
  function rounded(x,y,w,h,r) {
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function loop(now) {
    if(!ended&&!paused&&now-lastTick>=tickMs) {
      step();lastTick=now;
    }
    draw();requestAnimationFrame(loop);
  }
  function activateAudio() {
    AudioSystem.init();
    if(AudioSystem.ctx && AudioSystem.ctx.state==="suspended") AudioSystem.ctx.resume();
  }
  document.addEventListener('pointerdown',activateAudio,{once:true});
  document.addEventListener('keydown',activateAudio,{once:true});
  $('musicToggle').addEventListener('click',()=>{activateAudio();AudioSystem.toggleMusic();});
  $('soundToggle').addEventListener('click',()=>{activateAudio();AudioSystem.toggleSfx();});
  document.addEventListener('keydown',e=>{
    if($('overlay').style.display!=='none'&&(e.key==='Enter'||e.code==='Space')) {
      e.preventDefault(); $('restart').click(); return;
    }
    const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
    const key=e.key.length===1?e.key.toLowerCase():e.key;
    if(map[key]){e.preventDefault();setDirection(map[key]);}
    if(e.code==='Space'){e.preventDefault();if(!ended && $('overlay').style.display==='none'){paused=!paused;lastTick=performance.now();}}
  });
  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(b.dataset.dir);});
  });
  $('pauseTouch').addEventListener('click',()=>{if(!ended){paused=!paused;lastTick=performance.now();}});
  $('restart').addEventListener('click',()=>{
    if(ended) reset();
    paused=false; ended=false; $('overlay').style.display='none'; lastTick=performance.now();
    AudioSystem.init(); if(AudioSystem.ctx&&AudioSystem.ctx.state==='suspended') AudioSystem.ctx.resume();
  });
  window.addEventListener('resize',resize);
  reset();resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
