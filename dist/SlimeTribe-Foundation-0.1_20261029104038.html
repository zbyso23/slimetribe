.eg-inspector{border-right:0;border-left:1px solid #334c68}.eg-toolbox input,.eg-inspector input,.eg-inspector select{width:100%;padding:5px 6px;background:#091625;color:#e2efff;border:1px solid #446080;border-radius:6px}
.eg-inspector label{display:block;margin:9px 0;font-size:11px;color:#b0c5db}.eg-inspector label input,.eg-inspector label select{margin-top:4px;font-size:12px}
.eg-toolbox h3,.eg-inspector h3{color:#eaca80;font:800 12px system-ui;margin:3px 0 10px}
.eg-toolbox button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;margin:5px 0;padding:9px 7px;border-left:4px solid var(--node-color,#6b9fff)}
.eg-tip{color:#a3b5cf;font-size:11px;line-height:1.5;margin:10px 0}.eg-toolbox .eg-type{opacity:.72;font:10px monospace;margin-left:auto}
.eg-vp{position:relative;overflow:hidden;background-color:#070d1b;background-image:radial-gradient(#2b405b .95px,transparent 1px);background-size:24px 24px;touch-action:none;cursor:grab;outline:none}
.eg-vp:focus-visible{outline:2px solid #d9ac5c;outline-offset:-3px}.eg-vp.panning{cursor:grabbing}
.eg-world{position:absolute;left:0;top:0;transform-origin:0 0;width:6000px;height:5000px}
.eg-wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;width:6000px;height:5000px}
.eg-wires path{fill:none;stroke-width:3;stroke-linecap:round;pointer-events:none}.eg-wires path.preview{stroke-dasharray:6 6;stroke:#f7dfaa}
.eg-node{position:absolute;width:236px;min-height:114px;border:1px solid var(--nc,#7396dc);border-radius:11px;background:linear-gradient(145deg,#17263c,#0c1727);box-shadow:0 7px 18px #000a;user-select:none}
.eg-node.selected{outline:2px solid #f5c56f;outline-offset:2px;z-index:2}.eg-node.disabled{opacity:.54}
.eg-head{height:34px;background:color-mix(in srgb,var(--nc,#6b9fff) 35%,#17263c);color:#f5f9ff;border-radius:9px 9px 0 0;padding:8px 10px;cursor:grab;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-desc{height:30px;padding:5px 12px;color:#a5bdd6;font:11px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg-ports{padding:0 14px 9px;font:11px system-ui;min-height:30px}.eg-slot{height:26px;position:relative;display:flex;justify-content:space-between;align-items:center;color:#adbed0;border-top:1px solid #ffffff10}
.eg-pin{position:absolute;width:16px;height:16px;padding:0!important;border-radius:50%!important;top:5px;background:#0a182b!important;border:2px solid var(--pc,#e8f1ff)!important;cursor:crosshair!important;touch-action:none;z-index:4}
.eg-pin[data-dir=in]{left:-23px}.eg-pin[data-dir=out]{right:-23px}.eg-pin.exec{border-radius:3px!important;transform:rotate(45deg) scale(.8)}
.eg-pin:hover{box-shadow:0 0 0 5px #ffffff25}.eg-pin.pending{background:#ffe2a0!important;box-shadow:0 0 10px #ffdc83}
.eg-node .eg-meta{padding:0 12px 8px;font:10px monospace;color:#8da6c1;white-space:nowrap;overflow:hidden}
.eg-foot{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#111e31;border-top:1px solid #304966;color:#9fb7d0;font:11px ui-monospace,monospace}
.eg-mini{position:absolute;right:10px;bottom:10px;border:1px solid #53748c;background:#0a1623ed;border-radius:8px;width:170px;height:112px;cursor:pointer;z-index:8;touch-action:none}
.eg-zoom{position:absolute;top:10px;right:10px;background:#091524dc;padding:5px 10px;border:1px solid #3e5877;border-radius:999px;color:#c4d9ed;z-index:9;font:11px monospace}
.eg-errors{background:#4d2431;color:#ffe6e8;padding:6px;border-radius:6px;white-space:pre-wrap;font:11px monospace}.eg-ok{color:#5de8c7}
.eg-inspector .eg-actions{display:flex;gap:5px;flex-wrap:wrap}.eg-inspector .eg-actions button{font-size:11px}

  if (window.EDU && EDU.bus) EDU.bus.on('pause', (e) => api.hold(e && e.paused));
})();

</script><script data-source="game/game-music.js">
/*
 * Game · hudba pro hry: bubeník + 2 syntaky, postavená znovupoužitím Song sekvenceru (snd/snd-song.js). Žádné vzorky ani Sampler. Jmenný prostor GAME.Music.
 * Tady jsou jen DATA (tři smyčky, předvolby syntaků a pomůcky); hraje je GAME.Audio (game-audio.js) a počítá je SND.Song.mixdown.
 *
 *   GAME.Music.NAMES            ['rtype', 'dyna', 'axe']    smyčky „ve stylu“ (vlastní skladby, ne přepisy): R-Type like, Dyna Blaster like, Golden Axe like
 *   GAME.Music.song(name)       → nový Song model (JSON pro SND.Song.sanitize), 3 stopy: bicí, syntak 1 (basa), syntak 2 (melodie); čtvrtá stopa prázdná
 *   GAME.Music.META[name]       { bpm, key, chords[8], style } – kdo a co hraje; podle toho testy hlídají, že noty sedí na akordy a do stupnice
 *   GAME.Music.PRESETS          předvolby syntaků ve stejném tvaru jako SND.PRESETS (funkce, které upraví patch): g-bass g-sqbass g-lead g-sawlead g-pluck
 *   GAME.Music.clean(song)      → kopie bez bitů Sampleru v bicích (16 a 32), takže hra nikdy nezávisí na nahraných vzorcích
 *   GAME.Music.parse(str, kind) 'A2 - C3 …' → osm čísel patternu (noty: MIDI; '-' pauza) · 'kh h sh …' → bitové masky bicích (k kick, s snare, h hat, p perc)
 *
 * Poctivé meze (jsou dané Song jádrem, ne tímhle souborem): 8 kroků (osmin) na takt, jeden tón na krok, tón trvá 90 % kroku (držené tóny se dělají opakováním),
 * dva syntaky = nejvýš dva hlasy najednou, bicí jsou počítané (ne nahrané), takže znějí „čipově“. Zní to, jak to zní: tento soubor jsem napsal bez poslechu,
 * správnost not (akordy, stupnice, délky) hlídají testy, líbivost ne.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = root.GAME = root.GAME || {};
  const STEPS = 8, MAXSLOTS = 256;

  // ---------------------------------------------------------------- zápis
  const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function note(s) {   // 'A2', 'F#3', 'Bb1' → MIDI (C-1 = 0, A4 = 69); '-' = pauza (0)
    if (s === '-') return 0;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(s); if (!m) throw new Error('note ' + s);
    return 12 * (+m[3] + 1) + PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const DR = { k: 1, s: 2, h: 4, p: 8 };
  function parse(str, kind) {
    const t = String(str).trim().split(/\s+/); if (t.length !== STEPS) throw new Error('pattern má mít ' + STEPS + ' kroků: ' + str);
    return t.map((x) => (kind === 'drum' ? (x === '-' ? 0 : [...x].reduce((a, c) => a | DR[c], 0)) : note(x)));
  }

  // ---------------------------------------------------------------- předvolby syntaků (tvar jako SND.PRESETS: funkce upravující patch z SND.DEFAULT_PATCH)
  const PRESETS = {
    'g-bass': (p) => Object.assign(p, { osc: { shape: 'saw', detune: 0, sub: 0.5, fmRatio: 0, fmIndex: 0, blep: true }, filter: { type: 'lp', cutoff: 420, q: 2.5, env: 2.5 }, aenv: { a: 0.003, d: 0.16, s: 0.55, r: 0.05 }, fenv: { a: 0.001, d: 0.12, s: 0.15, r: 0.05 }, lfo: { rate: 5, depth: 0, target: 'pitch' }, drive: 0.2 }),
    'g-sqbass': (p) => Object.assign(p, { osc: { shape: 'square', detune: 0, sub: 0, fmRatio: 0, fmIndex: 0, blep: true }, filter: { type: 'lp', cutoff: 600, q: 1.5, env: 2 }, aenv: { a: 0.003, d: 0.1, s: 0.7, r: 0.04 }, fenv: { a: 0.001, d: 0.1, s: 0.2, r: 0.04 }, lfo: { rate: 5, depth: 0, target: 'pitch' }, drive: 0.1 }),
    'g-lead': (p) => Object.assign(p, { osc: { shape: 'square', detune: 7, sub: 0, fmRatio: 0, fmIndex: 0, blep: true }, filter: { type: 'lp', cutoff: 3000, q: 1.2, env: 1 }, aenv: { a: 0.006, d: 0.1, s: 0.75, r: 0.07 }, fenv: { a: 0.004, d: 0.2, s: 0.4, r: 0.07 }, lfo: { rate: 5.5, depth: 0.12, target: 'pitch' }, drive: 0 }),
    'g-sawlead': (p) => Object.assign(p, { osc: { shape: 'saw', detune: 6, sub: 0, fmRatio: 0, fmIndex: 0, blep: true }, filter: { type: 'lp', cutoff: 2200, q: 1.5, env: 1.5 }, aenv: { a: 0.01, d: 0.12, s: 0.7, r: 0.1 }, fenv: { a: 0.006, d: 0.25, s: 0.35, r: 0.1 }, lfo: { rate: 5, depth: 0.15, target: 'pitch' }, drive: 0.08 }),
    'g-pluck': (p) => Object.assign(p, { osc: { shape: 'square', detune: 0, sub: 0, fmRatio: 0, fmIndex: 0, blep: true }, filter: { type: 'lp', cutoff: 1800, q: 1, env: 3 }, aenv: { a: 0.002, d: 0.13, s: 0.05, r: 0.06 }, fenv: { a: 0.001, d: 0.1, s: 0, r: 0.06 }, lfo: { rate: 5, depth: 0, target: 'pitch' }, drive: 0 }),
  };

  // ---------------------------------------------------------------- skladby (vlastní, „ve stylu“)
  // Rozvržení patternů v Song modelu: 0…7 = bicí D1…D8, 8…15 = syntaky S1…S8 (sdílené oběma syntaky). Basa používá S1…S4, melodie S5…S8.
  // chords: akord každého ze 8 taktů (kořen a tóny akordu) – pro kontrolu v testech.
  const CH = { Am: [9, 0, 4], F: [5, 9, 0], G: [7, 11, 2], E: [4, 8, 11], C: [0, 4, 7], D: [2, 6, 9], Em: [4, 7, 11], B: [11, 3, 6] };
  const DEFS = {
    rtype: {
      bpm: 138, key: 'Am', scale: [9, 11, 0, 2, 4, 5, 7], style: 'temný pochod, osminová basa s oktávovými skoky, krátké smutně-hrdé motivy',
      chords: ['Am', 'Am', 'F', 'F', 'G', 'G', 'F', 'E'],
      drums: ['kh h sh h kh h sh h', 'kh h sh h kh s s sp', 'kh h sh kh kh h sh sp'], drumSlots: [0, 0, 0, 0, 0, 0, 2, 1],
      bass: ['A1 A1 A2 A1 A1 A2 A1 A2', 'F1 F1 F2 F1 F1 F2 F1 F2', 'G1 G1 G2 G1 G1 G2 G1 G2', 'E1 E1 E2 E1 E1 E2 G#1 B1'], bassSlots: [0, 0, 1, 1, 2, 2, 1, 3],
      lead: ['A4 - C5 - E5 - D5 C5', 'E5 - D5 C5 A4 - C5 -', 'F5 - E5 C5 A4 - C5 F4', 'G4 - B4 D5 G5 - D5 B4'], leadSlots: [0, 1, 2, 2, 3, 3, 2, -1],
      syn: [{ preset: 'g-bass', cutoff: 380 }, { preset: 'g-lead', cutoff: 3200 }], vol: [0.7, 0.8, 0.5], pan: [0, -0.1, 0.18],
    },
    dyna: {
      bpm: 152, key: 'C', scale: [0, 2, 4, 5, 7, 9, 11], style: 'veselé poskakování, basa oom-pah, hravá melodie po stupnici',
      chords: ['C', 'C', 'F', 'F', 'G', 'G', 'C', 'G'],
      drums: ['kh h sh h kh kh sh h', 'kh h sh h kh sh sh sp'], drumSlots: [0, 0, 0, 0, 0, 0, 0, 1],
      bass: ['C2 - G2 - C3 - G2 -', 'F2 - C3 - F3 - C3 -', 'G2 - D3 - G3 - D3 B2'], bassSlots: [0, 0, 1, 1, 2, 2, 0, 2],
      lead: ['E5 G5 E5 C5 G5 E5 C5 -', 'C6 - B5 A5 G5 - E5 G5', 'A5 - F5 A5 C6 - A5 F5', 'B5 - G5 B5 D6 - B5 G5'], leadSlots: [0, 1, 2, 2, 3, 3, 0, 3],
      syn: [{ preset: 'g-sqbass', cutoff: 700 }, { preset: 'g-pluck', cutoff: 3600 }], vol: [0.65, 0.75, 0.55], pan: [0, -0.1, 0.2],
    },
    axe: {
      bpm: 96, key: 'Em', scale: [4, 6, 7, 9, 11, 0, 2], style: 'hrdinský pochod, pedál v basu s kvintami, fanfárová melodie',
      chords: ['Em', 'Em', 'C', 'D', 'Em', 'Em', 'C', 'B'],
      drums: ['kh p sh p kh p sh p', 'kh p sh p k s s sp'], drumSlots: [0, 0, 0, 0, 0, 0, 0, 1],
      bass: ['E2 - E2 B2 E2 - B2 G2', 'C2 - C2 G2 C2 - G2 E2', 'D2 - D2 A2 D2 - A2 F#2', 'B1 - B1 F#2 B1 - F#2 D#2'], bassSlots: [0, 0, 1, 2, 0, 0, 1, 3],
      lead: ['E5 - B4 - E5 - G5 -', 'B5 - A5 G5 E5 - G5 B5', 'C6 - G5 - E5 - G5 -', 'D6 - A5 - F#5 - A5 -'], leadSlots: [0, 1, 2, 3, 0, 1, 2, -1],
      syn: [{ preset: 'g-bass', cutoff: 500 }, { preset: 'g-sawlead', cutoff: 2400 }], vol: [0.75, 0.8, 0.5], pan: [0, -0.1, 0.15],
    },
  };
  const NAMES = Object.keys(DEFS);
  const META = {}; NAMES.forEach((n) => { const d = DEFS[n]; META[n] = { bpm: d.bpm, key: d.key, scale: d.scale.slice(), style: d.style, chords: d.chords.slice(), len: d.chords.length, chordPcs: d.chords.map((c) => CH[c].slice()), leadSlots: d.leadSlots.slice(), bassSlots: d.bassSlots.slice() }; });

  const slots = (arr) => Array.from({ length: MAXSLOTS }, (_, i) => (i < arr.length ? arr[i] : -1));
  function song(name) {
    const d = DEFS[name]; if (!d) { const e = G.Error ? new G.Error('badMusic') : new Error('badMusic'); throw e; }
    const pats = []; for (let i = 0; i < 16; i++) pats[i] = new Array(STEPS).fill(0);
    d.drums.forEach((s, i) => { pats[i] = parse(s, 'drum'); });
    d.bass.forEach((s, i) => { pats[8 + i] = parse(s); }); d.lead.forEach((s, i) => { pats[12 + i] = parse(s); });
    const len = d.chords.length;
    return {
      bpm: d.bpm, len, loop: true, smp: [{ vol: 0.8, pan: 0 }, { vol: 0.8, pan: 0 }],
      tracks: [
        { inst: 'drum', vol: d.vol[0], pan: d.pan[0], mute: false, slots: slots(d.drumSlots) },
        { inst: 'syn1', vol: d.vol[1], pan: d.pan[1], mute: false, slots: slots(d.bassSlots.map((i) => 8 + i)) },
        { inst: 'syn2', vol: d.vol[2], pan: d.pan[2], mute: false, slots: slots(d.leadSlots.map((i) => (i < 0 ? -1 : 12 + i))) },
        { inst: 'syn2', vol: 0, pan: 0, mute: true, slots: slots([]) },
      ],
      pats,
      drum: { kick: { tune: 0, decay: 1, vol: 1 }, snare: { tune: 0, decay: 1, vol: 0.9 }, hat: { tune: 0, decay: 1, vol: 0.7 }, perc: { tune: 0, decay: 1, vol: 0.9 } },
      syn: d.syn.map((s) => Object.assign({}, s)),
    };
  }
  // bez Sampleru: z bicích se odstraní bity 16 a 32 (sample 1 a 2); ostatní zůstane
  function clean(s) {
    const c = JSON.parse(JSON.stringify(s));
    (c.pats || []).forEach((p, i) => { if (i < 8 && Array.isArray(p)) c.pats[i] = p.map((v) => (v | 0) & 15); });
    return c;
  }
  const seconds = (name) => { const d = DEFS[name]; return d.chords.length * STEPS * 60 / d.bpm / 2; };

  // zvuková knihovna (snd/snd-library.js): předvolby g-* jsou nástroje builtin.instrument.g-*, smyčky builtin.song.<jméno>. Jsou to tatáž data, jen s ID; hraje je pořád Song sekvencer.
  // Stará jména (music('rtype'), preset 'g-bass') jsou aliasy téhož; idempotentní.
  function registerLib() {
    const L = root.SND && root.SND.Library; if (!L || !root.SND.DEFAULT_PATCH) return false;
    Object.keys(PRESETS).forEach((k) => { if (!L.has('builtin.instrument.' + k)) L.addBuiltin('instrument', k, { nameKey: 'game.mus.preset.' + k, data: { kind: 'synth', patch: PRESETS[k](root.SND.DEFAULT_PATCH()) } }); });
    NAMES.forEach((n) => { if (!L.has('builtin.song.' + n)) L.addBuiltin('song', n, { nameKey: 'game.mus.n.' + n, make: () => song(n) }); });
    return true;
  }
  G.Music = { NAMES, META, PRESETS, PRESET_NAMES: Object.keys(PRESETS), song, clean, parse, note, seconds, STEPS, registerLib };
  registerLib();
  if (typeof module !== 'undefined') module.exports = G;
})();

/*
 * Game · zvukové efekty ze syntaku se 2 oscilátory (bez DOM, běží i v Node). Jmenný prostor GAME.Sfx.
 * Žádné vzorky: efekt je malý objekt (patch) a PCM se vypočítá. Stejný název + seed + parametry = stejný zvuk bit po bitu.
 *
 *   GAME.Sfx.NAMES                                   jména receptů: shoot laser boom bomb fuse hit punch swing hurt die jump coin powerup select step lose win open glitch pop click
 *   GAME.Sfx.make(name, seed, { size, pitch, len, rough })  → patch   recept + seed + 4 jednoduché parametry (čistá funkce)
 *        size 0…1 (velké = hlubší a delší, výchozí 0,5) · pitch −24…24 půltónů · len 0,25…3× délka · rough 0…1 (bitcrush + zkreslení)
 *   GAME.Sfx.sanitize(patch)                         → čistý patch (cizí JSON nic nerozbije; neznámé klíče zahodí, čísla ořízne)
 *   GAME.Sfx.render(patch, sr = 22050)               → { pcm: Float32Array, sr, seconds, info }   info = { peakRaw, clipped, fmax, fmin, nyquist, aliasHz, inaudible }
 *   GAME.Sfx.get(name, seed, params, sr, cache)      → render + malá paměť (Map); vrací stejný objekt jako render
 *   GAME.Sfx.pitchAt(patch, t) · GAME.Sfx.hash(pcm)  → průběh výšky v Hz · otisk PCM (FNV-1a z 16bitových vzorků)
 *
 * Patch: { f (Hz základní), len (s), slide (oktávy za celou délku, záporné = klesá), curve (−1…1),
 *          o1 { shape square|saw|tri|sine|noise, pw (střída 0,05…0,95), semi, cents }, o2 { …totéž, level 0…1 (0 = vypnutý) },
 *          mix add|fm|ring, arp { steps:[půltóny], rate (kroků/s) }, vib { rate, depth (půltóny) },
 *          env { a, d, s, r } (s hladina 0…1), lp { cut (Hz, 0 = vypnuto), sweep (oktávy), q }, crush { bits (0 = vypnuto), hold },
 *          drive, vol, seed }
 * Meze, které modul říká nahlas: oscilátory square/saw jsou pásmově omezené (PolyBLEP) jen do Nyquista; nad ním se zvuk překládá (aliasing)
 * a render to hlásí v info.aliasHz. FM režim používá holé tvary bez PolyBLEPu. Součet oscilátorů může přesáhnout plný rozsah (info.clipped);
 * výstup pak drží měkký limiter, ale zkreslení zůstane. Délka je nejvýš 2,5 s.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = root.GAME = root.GAME || {};
  const SR = 22050, MAXLEN = 2.5, TAU = Math.PI * 2, CEIL = 0.89;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const fail = (code, params) => { throw (G.Error ? new G.Error(code, params) : new Error(code)); };
  const SHAPES = ['square', 'saw', 'tri', 'sine', 'noise'], MIXES = ['add', 'fm', 'ring'];

  function rng(seed) {   // mulberry32, stejný jako SND.rng i G.rng (nezávislý, aby modul běžel sám)
    let a = (seed | 0) >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ------------------------------------------------------------------ model
  const DEF = () => ({
    f: 440, len: 0.25, slide: 0, curve: 0,
    o1: { shape: 'square', pw: 0.5, semi: 0, cents: 0 }, o2: { shape: 'square', pw: 0.5, semi: 0, cents: 0, level: 0 }, mix: 'add',
    arp: { steps: [0], rate: 12 }, vib: { rate: 6, depth: 0 },
    env: { a: 0.002, d: 0.1, s: 0.5, r: 0.05 }, lp: { cut: 0, sweep: 0, q: 0.7 }, crush: { bits: 0, hold: 1 },
    drive: 0, vol: 0.8, seed: 1,
  });
  const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
  function sanitize(p) {
    if (!isObj(p)) fail('badSfx');
    const d = DEF(), num = (v, a, b, def) => (typeof v === 'number' && isFinite(v) ? clamp(v, a, b) : def);
    const osc = (o, def) => { const q = isObj(o) ? o : {}; return { shape: SHAPES.includes(q.shape) ? q.shape : def.shape, pw: num(q.pw, 0.05, 0.95, def.pw), semi: num(q.semi, -48, 48, def.semi), cents: num(q.cents, -100, 100, def.cents) }; };
    const o = { f: num(p.f, 20, 12000, d.f), len: num(p.len, 0.02, MAXLEN, d.len), slide: num(p.slide, -6, 6, d.slide), curve: num(p.curve, -1, 1, d.curve) };
    o.o1 = osc(p.o1, d.o1); o.o2 = Object.assign(osc(p.o2, d.o2), { level: num(isObj(p.o2) ? p.o2.level : undefined, 0, 1, d.o2.level) });
    o.mix = MIXES.includes(p.mix) ? p.mix : d.mix;
    const a = isObj(p.arp) ? p.arp : {};
    o.arp = { steps: Array.isArray(a.steps) && a.steps.length ? a.steps.slice(0, 8).map((s) => Math.round(num(s, -48, 48, 0))) : [0], rate: num(a.rate, 1, 60, d.arp.rate) };
    const v = isObj(p.vib) ? p.vib : {}; o.vib = { rate: num(v.rate, 0, 30, d.vib.rate), depth: num(v.depth, 0, 4, d.vib.depth) };
    const e = isObj(p.env) ? p.env : {}; o.env = { a: num(e.a, 0, 1, d.env.a), d: num(e.d, 0, 2.5, d.env.d), s: num(e.s, 0, 1, d.env.s), r: num(e.r, 0, 1, d.env.r) };
    const l = isObj(p.lp) ? p.lp : {}; o.lp = { cut: l.cut === 0 ? 0 : num(l.cut, 40, 16000, 0), sweep: num(l.sweep, -6, 6, 0), q: num(l.q, 0.3, 8, d.lp.q) };
    const c = isObj(p.crush) ? p.crush : {}; o.crush = { bits: c.bits ? Math.round(num(c.bits, 2, 14, 0)) : 0, hold: Math.round(num(c.hold, 1, 32, 1)) };
    o.drive = num(p.drive, 0, 1, 0); o.vol = num(p.vol, 0, 1, d.vol); o.seed = Math.round(num(p.seed, 0, 2147483647, 1));
    return o;
  }

  // ------------------------------------------------------------------ výška v čase
  const warp = (u, c) => (c >= 0 ? 1 - (1 - u) ** (1 + 2 * c) : u ** (1 - 2 * c));   // c > 0: změna je rychlá na začátku, c < 0: na konci
  function arpAt(a, t) { const i = Math.min(a.steps.length - 1, Math.floor(t * a.rate)); return a.steps[i]; }
  // základní kmitočet (Hz) v čase t před posunem oscilátorů o semi/cents
  function pitchAt(p, t) {
    const u = clamp(t / p.len, 0, 1), semis = p.slide * 12 * warp(u, p.curve) + arpAt(p.arp, t) + (p.vib.depth ? p.vib.depth * Math.sin(TAU * p.vib.rate * t) : 0);
    return p.f * 2 ** (semis / 12);
  }
  const oscHz = (f, o) => f * 2 ** (o.semi / 12 + o.cents / 1200);

  // ------------------------------------------------------------------ oscilátor
  function polyblep(ph, dt) {
    if (dt > 0.5) dt = 0.5;
    if (ph < dt) { const x = ph / dt; return 2 * x - x * x - 1; }
    if (ph > 1 - dt) { const x = (ph - 1) / dt; return x * x + 2 * x + 1; }
    return 0;
  }
  function wave(shape, ph, dt, pw, st, blep) {   // st: stav šumu { v, R }
    switch (shape) {
      case 'sine': return Math.sin(TAU * ph);
      case 'tri': return 4 * Math.abs(ph - 0.5) - 1;
      case 'saw': return 2 * ph - 1 - (blep ? polyblep(ph, dt) : 0);
      case 'square': { let v = ph < pw ? 1 : -1; if (blep) { v += polyblep(ph, dt); v -= polyblep((ph + 1 - pw) % 1, dt); } return v; }
      default: return st.v;   // noise: drží náhodnou hodnotu a mění ji při každém oběhu fáze, takže „výška“ šumu řídí jeho barvu
    }
  }
  function biquadLP(fc, q, sr) {
    const w = TAU * fc / sr, c = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al;
    return { b0: (1 - c) / 2 / a0, b1: (1 - c) / a0, b2: (1 - c) / 2 / a0, a1: -2 * c / a0, a2: (1 - al) / a0 };
  }

  // ------------------------------------------------------------------ render
  function render(patch, sr = SR) {
    const p = sanitize(patch), n = Math.max(1, Math.round(p.len * sr)), out = new Float32Array(n), R = rng(p.seed);
    const nz1 = { v: R() * 2 - 1 }, nz2 = { v: R() * 2 - 1 };
    const fm = p.mix === 'fm', blep = !fm, lvl = p.o2.level, env = p.env, r = Math.min(env.r, p.len), tr = p.len - r;
    let ph1 = 0, ph2 = 0, z1 = 0, z2 = 0, c = null, lastCut = -1, hv = 0, peak = 0, fmax = 0, fmin = Infinity;
